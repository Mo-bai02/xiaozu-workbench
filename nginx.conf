server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 压缩：JSON/CSS/JS/SVG 都值得压
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后能拿到新资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退：/logs、/generator 直接刷新也能打开
    location / {
        try_files $uri $uri/ /index.html;
    }
}
